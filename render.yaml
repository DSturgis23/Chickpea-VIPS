services:
  - type: web
    name: chickpea-vips
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SR_CLIENT_ID
        sync: false
      - key: SR_CLIENT_SECRET
        sync: false
      - key: APP_PIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VIP_TAGS
        value: VIP
