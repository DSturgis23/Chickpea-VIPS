<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chickpea VIPs</title>
  <meta name="theme-color" content="#5B1A2D">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VIPs">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Chickpea <span>VIPs</span></h1>
    <a href="{{ url_for('logout') }}">Log out</a>
  </header>
  <main>
    <div class="search">
      <input id="q" type="search" placeholder="Guest name or email" autocomplete="off" autocapitalize="words" enterkeyhint="search">
      <div class="hint" id="hint">Tags go on the guest's SevenRooms profile and show at every pub.</div>
    </div>
    <div id="results"></div>
  </main>
  <div class="toast" id="toast"></div>

<script>
const TAGS = {{ tags|tojson }};
const $q = document.getElementById("q"), $res = document.getElementById("results"),
      $hint = document.getElementById("hint"), $toast = document.getElementById("toast");
let timer, seq = 0;

function toast(msg, err) {
  $toast.textContent = msg; $toast.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => $toast.className = "toast", 2800);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"});
}

function card(c) {
  const meta = [];
  if (c.last_visit) meta.push(`Last: ${fmtDate(c.last_visit)}${c.last_venue ? " · " + esc(c.last_venue) : ""}`);
  const contact = [c.email, c.phone].filter(Boolean).map(esc).join(" · ");
  const buttons = TAGS.map(t => {
    const on = c.tags.includes(t);
    return `<button class="tag${on ? " on" : ""}" data-id="${esc(c.id)}" data-tag="${esc(t)}" data-on="${on}">${on ? esc(t) : "Mark " + esc(t)}</button>`;
  }).join("");
  return `<div class="card${c.tags.length ? " is-vip" : ""}" id="c-${esc(c.id)}">
    <div class="top"><div class="name">${esc(c.name || "(no name)")}</div>
      <div class="visits">${c.visits} visit${c.visits === 1 ? "" : "s"}</div></div>
    ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}
    ${contact ? `<div class="meta">${contact}</div>` : ""}
    <div class="actions">${buttons}</div></div>`;
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("auth"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "Something went wrong."); e.data = j; throw e; }
  return j;
}

async function search() {
  const q = $q.value.trim(), mine = ++seq;
  if (q.length < 2) { $res.innerHTML = ""; $hint.textContent = "Tags go on the guest's SevenRooms profile and show at every pub."; return; }
  $hint.textContent = "Searching…";
  try {
    const { results } = await api("/api/search?q=" + encodeURIComponent(q));
    if (mine !== seq) return;
    $res.innerHTML = results.length ? results.map(card).join("") : `<div class="empty">No guests found for “${esc(q)}”.</div>`;
    $hint.textContent = results.length > 1
      ? `${results.length} profiles — the same guest can have several. Busiest first.`
      : results.length ? "1 profile found." : "";
  } catch (e) { if (mine === seq && e.message !== "auth") { $hint.textContent = ""; toast(e.message, true); } }
}
$q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 350); });
$q.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(timer); search(); $q.blur(); } });

$res.addEventListener("click", async e => {
  const b = e.target.closest("button.tag"); if (!b) return;
  const on = b.dataset.on === "true", tag = b.dataset.tag;
  // Removing needs a second tap, so a stray thumb can't strip someone's VIP.
  if (on && !b.classList.contains("confirm")) {
    b.classList.add("confirm"); b.textContent = "Tap again to remove";
    setTimeout(() => { if (b.isConnected && !b.disabled) { b.classList.remove("confirm"); b.textContent = tag; } }, 3000);
    return;
  }
  b.classList.remove("confirm");
  b.disabled = true; b.textContent = on ? "Removing…" : "Saving…";
  try {
    const { client } = await api("/api/tag", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client_id: b.dataset.id, tag, action: on ? "remove" : "add" }) });
    document.getElementById("c-" + client.id).outerHTML = card(client);
    toast(on ? `${tag} removed from ${client.name}` : `${client.name} marked ${tag} ★`);
  } catch (err) {
    if (err.message === "auth") return;
    b.disabled = false; b.textContent = on ? tag : "Mark " + tag;
    toast(err.message, true);
  }
});
</script>
</body>
</html>
