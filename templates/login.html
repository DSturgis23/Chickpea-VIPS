<!doctype html>
<html lang="en">
<head>
{% include "_head.html" %}
</head>
<body class="login-page">
  <form class="login" method="post">
    {% with size=72 %}{% include "_mark.html" %}{% endwith %}
    <h1>Chickpea <span>VIPs</span></h1>
    <p>Enter your PIN to continue</p>
    <input type="password" name="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" aria-label="PIN" autofocus required>
    <button class="go" type="submit">Unlock</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
</body>
</html>
